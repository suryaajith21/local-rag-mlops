name: RAG Evaluation Pipeline v2

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  evaluate-rag:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install / sync dependencies
        working-directory: ${{ github.workspace }}
        run: |
          conda run -n rag-ops python -m pip install -r requirements.txt -q

      - name: Run ingestion pipeline (all PDFs in data/)
        working-directory: ${{ github.workspace }}
        run: |
          conda run -n rag-ops python scripts/ci_ingest.py

      - name: Start FastAPI server
        working-directory: ${{ github.workspace }}
        run: |
          start /B cmd /c conda run -n rag-ops uvicorn src.api.server:app --host 0.0.0.0 --port 8000
          timeout /T 20 /NOBREAK

      - name: Verify server health
        working-directory: ${{ github.workspace }}
        run: |
          conda run -n rag-ops python scripts/ci_health_check.py

      - name: Run evaluation (eval_v2.py)
        working-directory: ${{ github.workspace }}
        run: |
          conda run -n rag-ops python evaluation/eval_v2.py

      - name: Stop FastAPI server
        if: always()
        shell: powershell
        run: |
          $result = netstat -ano | Select-String ":8000\s.*LISTENING"
          if ($result) {
            $server_pid = ($result.ToString().Trim() -split '\s+')[-1]
            taskkill /F /PID $server_pid
            Write-Host "Killed PID $server_pid"
          } else {
            Write-Host "No process on port 8000, nothing to kill"
          }

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-v2-${{ github.run_number }}
          path: |
            evaluation/v2/evaluation_results_v2.csv
            evaluation/v2/summary.json
            evaluation/v2/test_dataset.json
          if-no-files-found: warn
